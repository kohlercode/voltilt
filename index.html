  <style>
    :root {
      --bg: #070a12;
      --bg-2: #0d1220;
      --text: #e8ecf8;
      --muted: #9aa3bd;
      --accent: #7b93ff;
      --line: rgba(255, 255, 255, 0.12);
      --font-display: "Syne", sans-serif;
      --font-body: "Manrope", sans-serif;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
    }

    body {
      background:
        radial-gradient(ellipse 90% 55% at 50% -10%, rgba(70, 96, 180, 0.22), transparent 60%),
        radial-gradient(ellipse 60% 40% at 100% 30%, rgba(30, 48, 90, 0.35), transparent 55%),
        linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 100%);
    }

    .hero {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    .hero-copy {
      width: min(720px, 100%);
      margin: 0 auto;
      padding: clamp(28px, 5vw, 48px) clamp(20px, 4vw, 40px) 28px;
      text-align: center;
      animation: rise 0.7s ease both;
    }

    h1 {
      margin: 0 0 14px;
      font-family: var(--font-display);
      font-weight: 800;
      font-size: clamp(2.8rem, 9vw, 4.75rem);
      letter-spacing: -0.04em;
      line-height: 0.95;
    }

    .lead {
      margin: 0 auto 28px;
      max-width: 34rem;
      font-size: clamp(1.05rem, 2.4vw, 1.25rem);
      line-height: 1.5;
      color: var(--muted);
      font-weight: 500;
      animation: rise 0.7s ease 0.08s both;
    }

    .cta {
      display: flex;
      flex-wrap: wrap;
      gap: 12px 18px;
      justify-content: center;
      align-items: center;
      animation: rise 0.7s ease 0.16s both;
    }

    .cta a {
      color: inherit;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
    }

    .cta a.primary {
      padding: 12px 18px;
      border: 1px solid var(--line);
      background: rgba(123, 147, 255, 0.14);
      transition: border-color 0.2s ease, background 0.2s ease, transform 0.2s ease;
    }

    .cta a.primary:hover,
    .cta a.primary:focus-visible {
      border-color: rgba(123, 147, 255, 0.55);
      background: rgba(123, 147, 255, 0.22);
      transform: translateY(-1px);
    }

    .cta a.secondary {
      color: var(--accent);
      text-underline-offset: 3px;
    }

    .cta a.secondary:hover,
    .cta a.secondary:focus-visible {
      text-decoration: underline;
    }

    .hero-visual {
      flex: 1;
      display: flex;
      align-items: stretch;
      min-height: min(48vh, 420px);
      animation: fade 1s ease 0.2s both;
    }

    .hero-visual img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      border-top: 1px solid var(--line);
    }

    footer {
      padding: 22px clamp(20px, 4vw, 40px) 28px;
      text-align: center;
      font-size: 0.85rem;
      color: #6b738a;
      border-top: 1px solid var(--line);
    }

    footer a {
      color: #9aa8d9;
      text-decoration: none;
      text-underline-offset: 3px;
    }

    footer a:hover,
    footer a:focus-visible {
      color: #c5d0ff;
      text-decoration: underline;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fade {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @media (prefers-reduced-motion: reduce) {
      .hero-copy,
      .lead,
      .cta,
      .hero-visual {
        animation: none;
      }
      .cta a.primary:hover {
        transform: none;
      }
    }
  </style>

      <div class="cta">

        <a class="primary" href="examples/z-timeline/">Open Z-Timeline</a>

    </div>
    <div class="hero-visual">

        decoding="async"

    </div>

  </footer>
