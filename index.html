<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Voltilt demos</title>
  <style>
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: #070a12; color: #e8ecf8;
    }
    main { max-width: 420px; padding: 32px; }
    h1 { margin: 0 0 8px; font-size: 1.6rem; }
    p { color: #8b95b0; margin: 0 0 24px; }
    a {
      display: block; padding: 14px 16px; margin-bottom: 10px;
      border-radius: 12px; text-decoration: none; color: inherit;
      background: #151b2c; border: 1px solid rgba(255,255,255,0.1);
    }
    a:hover { border-color: rgba(109,141,255,0.5); }
    a span { display: block; font-size: 0.8rem; color: #8b95b0; margin-top: 4px; }
    .by { margin-top: 28px; font-size: 0.8rem; color: #6b738a; }
    a.inline { display: inline; padding: 0; margin: 0; background: none; border: 0; color: #9aa8d9; text-decoration: underline; text-underline-offset: 3px; }
    a.inline:hover { border: 0; color: #c5d0ff; }
  </style>
</head>
<body>
  <main>
    <h1>Voltilt</h1>
    <p>High-performance CSS-3D navigation demos</p>
    <a href="/examples/coverflow/">
      Coverflow
      <span>2,500 cards from JSON · windowed DOM</span>
    </a>
    <a href="/examples/z-timeline/">
      Z-Timeline
      <span>5,000 cards from JSON · virtualized scroll</span>
    </a>
    <p class="by">A <a class="inline" href="https://kohlercode.com" target="_blank" rel="noopener">KohlerCode</a> project</p>
  </main>
</body>
</html>
